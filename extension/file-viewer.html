<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件预览</title><link rel="stylesheet" href="viewer.css"><link rel="stylesheet" href="file-viewer.css"></head><body>
<header class="toolbar"><div class="brand"><span class="badge">文件</span><h1 id="title">文件预览</h1></div>
<div class="controls" id="image-controls" hidden><button id="zoom-out" disabled>缩小</button><span id="zoom-label">—</span><button id="zoom-in" disabled>放大</button><button id="rotate" disabled>旋转 90°</button><button id="fit" disabled>适应窗口</button></div>
<div class="controls" id="text-controls" hidden><button id="wrap" aria-pressed="true" disabled>自动换行</button><label for="encoding">编码</label><select id="encoding" disabled><option value="auto">自动（UTF-8 / UTF-16 BOM）</option><option value="utf-8">UTF-8</option><option value="gb18030">GB18030</option></select><button id="copy" disabled>复制全文</button><span id="copy-status" role="status"></span></div>
<div class="actions"><a id="original" class="button" hidden target="_blank" rel="noopener noreferrer">打开原文件</a><a id="download" class="button primary" hidden>下载原文件</a><a class="help" href="help.html" aria-label="使用帮助">?</a></div></header>
<div id="demo-note" hidden>这是随扩展安装的演示文件，不包含真实课程资料，无需联网。</div>
<main id="workspace"><section id="status" class="status" role="status" aria-live="polite"><h2 id="status-title">正在读取…</h2><p id="status-detail"></p><div class="status-actions"><button id="retry" hidden>重试</button><button id="grant" hidden>允许读取此服务器</button></div></section><div id="image-frame" hidden></div><pre id="text" tabindex="0" aria-label="文件文本" hidden></pre></main>
<script src="formats.js"></script><script src="catalog.js"></script><script src="core.js"></script><script type="module" src="file-viewer.mjs"></script></body></html>
